schema_version: 1
id: source-freshness
schedule: "11 */6 * * *"
owner_profile: media-director
board: media-os
workdir: /home/operator/.hermes/profiles/media-os/workspace
provider:
  primary: openai-codex
  fallback: [openai]
skills: [media-source-verification]
tools: [source_metadata_read, board_card_read]
budget:
  max_runs: 1
  max_items: 100
  max_tokens: 6000
dedupe_key: media-os.source-freshness
no_change: silent
destination: media-os:operations
continuity: resume_deduped
timeout_seconds: 300
failure_alert: owner_dm
checks: [source_freshness, blocked_card]
action: report_actionable_source_change
