name: agentik-shadcn-light
label: Agentik Light
description: A bright editorial workspace with compact shadcn-style surfaces.
palette:
  background:
    hex: "#fbfbfa"
    alpha: 1
  midground:
    hex: "#1f1f1e"
    alpha: 1
  foreground:
    hex: "#000000"
    alpha: 0
  warmGlow: "rgba(0, 0, 0, 0)"
  noiseOpacity: 0
typography:
  fontSans: "Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
  fontMono: "Geist Mono, SFMono-Regular, Cascadia Code, Roboto Mono, Menlo, monospace"
  fontDisplay: "Geist, Inter, ui-sans-serif, system-ui, sans-serif"
  baseSize: "14px"
  lineHeight: "1.5"
  letterSpacing: "-0.005em"
layout:
  radius: "0.625rem"
  density: compact
layoutVariant: standard
colorOverrides:
  card: "#ffffff"
  cardForeground: "#1f1f1e"
  popover: "#ffffff"
  popoverForeground: "#1f1f1e"
  primary: "#1f1f1e"
  primaryForeground: "#ffffff"
  secondary: "#f0f0ee"
  secondaryForeground: "#1f1f1e"
  muted: "#f0f0ee"
  mutedForeground: "#737370"
  accent: "#e9e9e6"
  accentForeground: "#1f1f1e"
  destructive: "#dc2626"
  destructiveForeground: "#ffffff"
  success: "#16803c"
  warning: "#b45309"
  border: "#dfdfdc"
  input: "#d2d2ce"
  ring: "#8a8a86"
componentStyles:
  card:
    background: "#ffffff"
    boxShadow: "none"
    clipPath: "none"
  header:
    background: "#fbfbfa"
    clipPath: "none"
  sidebar:
    background: "#f7f7f5"
    clipPath: "none"
  tab:
    clipPath: "none"
  page:
    background: "#fbfbfa"
customCSS: |
  :root {
    color-scheme: light;
  }
  #root h1,
  #root h2,
  #root h3,
  #root h4 {
    font-family: var(--theme-font-sans);
    letter-spacing: -0.015em !important;
    text-transform: none !important;
  }
  #root .uppercase {
    letter-spacing: 0;
    text-transform: none;
  }
  #root .tracking-wider,
  #root .tracking-widest {
    letter-spacing: 0;
  }
  #root button {
    letter-spacing: 0 !important;
    text-transform: none !important;
  }
  #root main .contents > .flex.flex-col.gap-8 {
    width: 100%;
    max-width: 70rem;
    margin-inline: auto;
    padding-top: 0.5rem;
  }
  #root main .contents > .flex.flex-col.gap-8 > section {
    gap: 0.75rem;
  }
  #root main .contents > .flex.flex-col.gap-8 > section > h2 {
    color: var(--color-foreground);
    font-size: 0.875rem;
    font-weight: 600;
  }
  #app-sidebar {
    border-color: var(--color-border);
  }
  #app-sidebar > div:first-child {
    height: 3.5rem;
    border-color: var(--color-border);
  }
  #app-sidebar > div:first-child .uppercase {
    font-size: 0.9375rem;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.02em;
    text-transform: none;
  }
  #app-sidebar nav {
    padding: 0.5rem;
    border-top: 0;
  }
  #app-sidebar nav ul {
    gap: 0.125rem;
  }
  #app-sidebar nav a {
    padding: 0.5rem 0.625rem;
    border-radius: 0.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-transform: none;
  }
  #app-sidebar nav a[aria-current="page"] {
    background: var(--color-secondary);
  }
  #app-sidebar nav a[aria-current="page"] > span:last-child {
    display: none;
  }
  #app-sidebar nav a > svg {
    width: 1rem;
    height: 1rem;
  }
  #app-sidebar nav a > span:last-child {
    border-radius: 0.5rem;
  }
  #hermes-sidebar-plugin-nav-heading {
    padding: 0.75rem 0.625rem 0.35rem;
    font-size: 0.6875rem;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
  }
