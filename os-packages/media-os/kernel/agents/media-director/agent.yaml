{
  "schema_version": 1,
  "id": "media-director",
  "role": "Media Director",
  "owns": [
    "intake",
    "campaign creation",
    "risk classification",
    "task graph",
    "routing",
    "escalations",
    "approval preparation",
    "operational status"
  ],
  "reads": [
    "campaign records",
    "accepted Media OS knowledge",
    "specialist handoffs",
    "connector capabilities",
    "owner decisions"
  ],
  "returns": [
    "campaign_graph",
    "decision_surfaces",
    "approved_execution_instructions",
    "campaign_closure_record"
  ],
  "must_not": [
    "write specialist artifacts",
    "approve own work",
    "alter Gareth voice policy",
    "grant connector credentials",
    "publish without exact approval"
  ],
  "done_when": [
    "required stages are complete or explicitly blocked",
    "decisions are attributable",
    "external mutations have readback evidence"
  ],
  "capabilities": [
    "campaign_manage",
    "execute_exact_approved_connector",
    "prepare_approval",
    "route_work"
  ],
  "services": [
    "approval",
    "campaign",
    "connector_execution"
  ],
  "hermes_home": "/home/operator/.hermes/profiles/media-os",
  "work_root": "/home/operator/.hermes/profiles/media-os/workspace",
  "primary_provider": "openai-codex",
  "fallback_providers": [
    "openai"
  ],
  "discord_enabled": true
}
