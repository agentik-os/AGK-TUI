# builder-os profile config (package reference). Apply with `hermes -p builder-os config set`.
# Secrets never live here (.env only).
model:
  provider: anthropic
  default: claude-fable-5.1
providers:
  agk-gemma-local:
    api: http://127.0.0.1:11434/v1
    transport: chat_completions
    default_model: gemma4:26b
    context_length: 262144
fallback_providers:
- provider: openai-codex
  model: gpt-5.6-sol
- provider: custom
  model: gemma4:26b
  base_url: http://127.0.0.1:11434/v1
agent:
  reasoning_effort: ultra
terminal:
  cwd: /usr/local/lib/agk-terminal/os-packages/builder-os
  home_mode: profile
checkpoints:
  enabled: true
  max_snapshots: 30
delegation:
  max_spawn_depth: 2
  max_concurrent_children: 10
  reasoning_effort: high
goals:
  max_turns: 30
kanban:
  review_dispatch: true
approvals:
  mode: 'off'
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: deny
memory:
  memory_enabled: true
  user_profile_enabled: false
security:
  redact_secrets: true
  protected_instruction_files: true
platforms:
  discord:
    enabled: true
    extra:
      mode: dedicated
      command_sync_policy: safe
      command_ui_mode: ui_only
