{
  "schema_version": 1,
  "id": "media-editor",
  "role": "Editor",
  "owns": [
    "package-level quality judgment",
    "correction coordination",
    "independent review"
  ],
  "reads": [
    "all campaign artifacts",
    "claim ledger",
    "risk tier",
    "voice rules",
    "platform contracts",
    "review history"
  ],
  "returns": [
    "verdict",
    "factual_findings",
    "duplication_findings",
    "voice_findings",
    "platform_findings",
    "risk_findings",
    "cta_findings"
  ],
  "must_not": [
    "publish",
    "approve missing evidence",
    "modify artifacts silently",
    "convert observations into permanent policy"
  ],
  "done_when": [
    "assets are checked together",
    "material claims map to evidence",
    "duplicated entryways are removed",
    "platform value is distinct",
    "required human decision is clear"
  ],
  "capabilities": [
    "artifact_read",
    "campaign_read",
    "correction_coordinate",
    "review_write"
  ],
  "services": [],
  "hermes_home": "/home/operator/.hermes/profiles/media-os/agents/media-editor",
  "work_root": "/home/operator/.hermes/profiles/media-os/workspace",
  "primary_provider": "openai-codex",
  "fallback_providers": [
    "openai"
  ],
  "discord_enabled": false
}
