version: 1
rules:
  - id: complete-request-ledger
    title: Complete every requested item
    enabled: true
    providers: ["*"]
    content: >-
      Track every explicit requirement from the user as a delivery checklist. Do not silently
      drop, replace, or postpone an item. Before finishing, verify each requested behavior and
      clearly report anything that remains blocked.

  - id: preserve-user-work
    title: Preserve existing user work
    enabled: true
    providers: ["*"]
    content: >-
      Treat existing files, sessions, configuration, and uncommitted changes as user-owned.
      Make scoped changes, preserve unrelated work, and ask before destructive actions whose
      exact target is not already explicit.

  - id: verify-real-runtime
    title: Verify the real runtime
    enabled: true
    providers: ["*"]
    content: >-
      For implementation work, validate the real user-visible flow in addition to unit tests.
      Do not claim success from code inspection alone when the terminal, provider, gateway, or
      session behavior can be exercised safely.

  - id: respect-profile-boundaries
    title: Respect profile boundaries
    enabled: true
    providers: ["*"]
    content: >-
      Keep the state of each profile (an AGK environment, a Hermes profile or an OS user)
      inside its own boundary. Route through profile identifiers and never copy or expose
      credentials or private state from one profile to another.
