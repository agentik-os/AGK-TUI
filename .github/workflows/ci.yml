name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest==9.0.2 PyYAML==6.0.3 Pillow==12.3.0
      - run: ./scripts/test.sh

  macos-bootstrap:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The documented one-liner pipes into the bash that macOS ships (3.2).
      - run: /bin/bash -n bootstrap-macos.sh install bin/agk bin/agk-terminal
      - run: /bin/bash ./bootstrap-macos.sh --dry-run --core-only
      - run: /bin/bash install --help
