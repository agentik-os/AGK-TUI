# Agentik OS RMUX policy. RMUX is runtime; `agk` is Control Mode.
set -g prefix C-b
bind C-b send-prefix
set -g mouse on
# Long agent conversations routinely exceed rmux's small default scrollback.
# AGK's history browser is lazy, so retaining the full buffer does not make the
# hot live-preview path more expensive.
set -g history-limit 500000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g status-keys vi
set -g escape-time 10
# `on` keeps every copy (copy-mode and OSC 52 from agent CLIs) in an RMUX
# buffer as well as forwarding it to attached clients. AGK mirrors panes
# without attaching a client, and relays new buffers to the real clipboard.
set -g set-clipboard on
# On the machine that owns the screen, copy-mode also feeds the system
# clipboard directly, so copying works in a plain `rmux attach` too.
if-shell 'command -v pbcopy' 'set -g copy-command pbcopy'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy' 'set -g copy-command wl-copy'
set -g allow-passthrough on
# Preserve truecolor and make mouse reporting work for SSH/Termius and terminal
# families that rmux does not recognize by name.
set -ga terminal-features ',*:RGB:mouse'
set -g status on
set -g status-position top
set -g status-left-length 100
set -g status-right-length 120
set -g status-left '#[fg=cyan,bold] AGK #[default] #S · #I:#W '
set -g status-right '#[fg=cyan]TERMINAL MODE #[fg=colour240]· #[fg=green]Ctrl-b d detach #[default]'

# Detach never kills persistent work.
bind d detach-client
bind v split-window -h -c '#{pane_current_path}'
bind b split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind [ copy-mode
# AGK access: the control menu is always one chord away from any live pane.
# The launcher lives in ~/.local/bin on single-user installs (macOS) and in
# /usr/local/bin on a system install; resolve it at popup time.
bind -n C-Space display-popup -E -w 100% -h 100% "sh -c 'if [ -x \"$HOME/.local/bin/agk\" ]; then exec \"$HOME/.local/bin/agk\"; elif command -v agk >/dev/null 2>&1; then exec agk; else exec /usr/local/bin/agk; fi'"
bind g display-popup -E -w 100% -h 100% "sh -c 'if [ -x \"$HOME/.local/bin/agk\" ]; then exec \"$HOME/.local/bin/agk\"; elif command -v agk >/dev/null 2>&1; then exec agk; else exec /usr/local/bin/agk; fi'"

# Direct sessions keep native scrollback controls even when AGK is closed.
bind -n M-Up if-shell -F '#{pane_in_mode}' 'send-keys -X scroll-up' 'copy-mode -e ; send-keys -X scroll-up'
bind -n M-Down if-shell -F '#{pane_in_mode}' 'send-keys -X scroll-down' 'copy-mode -e ; send-keys -X scroll-down'
# Preserve wheel input in alternate-screen provider views that do not request
# mouse reporting. Normal panes still enter RMUX history; mouse-aware apps keep
# receiving native wheel events.
bind -n WheelUpPane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'if-shell -F "#{alternate_on}" "send-keys -N3 Up" "copy-mode -e"'
bind -n WheelDownPane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'if-shell -F "#{alternate_on}" "send-keys -N3 Down"'
bind -n S-WheelUpPane copy-mode -e
bind -n M-WheelUpPane copy-mode -e
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
# Releasing a mouse drag copies, like every other terminal.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind r if-shell '[ -f "$HOME/.config/rmux/rmux.conf" ]' 'source-file ~/.config/rmux/rmux.conf' 'source-file /etc/rmux.conf' \; display-message 'AGK rmux configuration reloaded'
