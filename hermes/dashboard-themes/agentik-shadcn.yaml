name: agentik-shadcn
label: Agentik Shadcn
description: A compact neutral workspace inspired by modern shadcn applications.
palette:
  background:
    hex: "#09090b"
    alpha: 1
  midground:
    hex: "#fafafa"
    alpha: 1
  foreground:
    hex: "#ffffff"
    alpha: 0
  warmGlow: "rgba(124, 58, 237, 0.08)"
  noiseOpacity: 0
typography:
  fontSans: "Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
  fontMono: "Geist Mono, SFMono-Regular, Cascadia Code, Roboto Mono, Menlo, monospace"
  fontDisplay: "Geist, Inter, ui-sans-serif, system-ui, sans-serif"
  baseSize: "14px"
  lineHeight: "1.5"
  letterSpacing: "-0.005em"
layout:
  radius: "0.625rem"
  density: compact
layoutVariant: standard
colorOverrides:
  card: "#18181b"
  cardForeground: "#fafafa"
  popover: "#18181b"
  popoverForeground: "#fafafa"
  primary: "#fafafa"
  primaryForeground: "#18181b"
  secondary: "#27272a"
  secondaryForeground: "#fafafa"
  muted: "#27272a"
  mutedForeground: "#a1a1aa"
  accent: "#27272a"
  accentForeground: "#fafafa"
  destructive: "#ef4444"
  destructiveForeground: "#fafafa"
  success: "#22c55e"
  warning: "#f59e0b"
  border: "#27272a"
  input: "#3f3f46"
  ring: "#a1a1aa"
componentStyles:
  card:
    background: "#18181b"
    boxShadow: "none"
    clipPath: "none"
  header:
    background: "#09090b"
    clipPath: "none"
  sidebar:
    background: "#09090b"
    clipPath: "none"
  tab:
    clipPath: "none"
  page:
    background: "#09090b"
customCSS: |
  #app-sidebar {
    border-color: var(--color-border);
  }
  #app-sidebar nav a {
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-transform: none;
  }
  #app-sidebar nav a > svg {
    width: 1rem;
    height: 1rem;
  }
  #app-sidebar nav a > span:last-child {
    border-radius: 0.375rem;
  }
